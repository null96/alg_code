[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alg-code"
version = "0.1.0"
description = "Minimal runnable project for OpenClaw local-execution validation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3.0",
  "pandas>=2.2,<4.0",
  "scikit-learn>=1.6,<2.0",
]

[tool.setuptools]
packages = ["automl_runner"]
